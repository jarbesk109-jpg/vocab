# Giữ Supabase free tier không bị tạm dừng (nó dừng project sau 7 ngày "không hoạt động").
# FIX 06/10: bản cũ ping ĐỌC 2 lần/tuần mà vẫn bị dừng (ping 24/09 thành công, 28/09 đã dừng).
# Không rõ nguyên nhân chắc chắn → phòng nhiều lớp:
#   (1) chạy MỖI NGÀY thay vì 2 lần/tuần
#   (2) vừa ĐỌC vừa GHI 1 dòng nhỏ (id = keepalive-heartbeat) → chắc chắn có hoạt động database
#   (3) lỗi thì thử lại 5 lần; vẫn lỗi thì workflow đỏ → GitHub gửi mail báo
name: keep-supabase-awake
on:
  schedule:
    - cron: '17 1 * * *'     # 01:17 UTC mỗi ngày = 08:17 giờ VN (tránh phút :00 vì GitHub hay trễ giờ chẵn)
  workflow_dispatch:         # cho phép bấm chạy tay trong tab Actions
jobs:
  ping:
    runs-on: ubuntu-latest
    env:
      URL: https://quomfkcbbcnuubrpbwpl.supabase.co/rest/v1/vocab_sync
      KEY: sb_publishable_vo-fgRVSsp4wcfECUse7Cw_9obpBZzr   # khoá publishable, app cũng dùng công khai
    steps:
      - name: Đọc (SELECT)
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" --retry 5 --retry-all-errors --retry-delay 20 \
            "$URL?select=id&limit=1" -H "apikey: $KEY" -H "Authorization: Bearer $KEY")
          echo "Đọc: HTTP $code"
          test "$code" = "200"
      - name: Ghi (UPSERT 1 dòng heartbeat)
        run: |
          now=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          code=$(curl -s -o /dev/null -w "%{http_code}" --retry 5 --retry-all-errors --retry-delay 20 \
            -X POST "$URL" -H "apikey: $KEY" -H "Authorization: Bearer $KEY" \
            -H "Content-Type: application/json" -H "Prefer: resolution=merge-duplicates,return=minimal" \
            -d "[{\"id\":\"keepalive-heartbeat\",\"data\":{\"heartbeat\":\"$now\"},\"updated_at\":\"$now\"}]")
          echo "Ghi: HTTP $code"
          test "$code" = "201" -o "$code" = "200" -o "$code" = "204"
